{% extends 'store/base.html' %}

{% block titulo %}
Registro - TechGear
{% endblock %}

{% block contenido %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">Crear una cuenta</h2>

                        <p class="text-secondary">
                            Únete a TechGear y descubre nuestros productos.
                        </p>

                    </div>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label for="nombre" class="form-label fw-semibold">
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingresa tu nombre"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label for="correo" class="form-label fw-semibold">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control form-control-lg"
                                id="correo"
                                name="correo"
                                placeholder="ejemplo@correo.com"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label for="contrasena" class="form-label fw-semibold">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg"
                                id="contrasena"
                                name="contrasena"
                                placeholder="Crea una contraseña"
                                required
                            >

                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            Registrarme
                        </button>

                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0 text-secondary">
                        ¿Ya tienes una cuenta?
                        <a href="/login/" class="text-primary fw-semibold text-decoration-none">
                            Inicia sesión
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
